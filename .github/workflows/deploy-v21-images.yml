name: Deploy v21 remaining images

on:
  push:
    branches:
      - deploy-v21-20261006
    paths:
      - .github/workflows/deploy-v21-images.yml

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-v21-20261006
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild missing place images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import time
          import urllib.request
          from PIL import Image, ImageOps

          items = {
            "soka": ("https://upload.wikimedia.org/wikipedia/commons/e/e6/%E8%8D%89%E5%8A%A0%E6%9D%BE%E5%8E%9F1.jpg", 640, 480),
            "takefu": ("https://upload.wikimedia.org/wikipedia/commons/4/41/Yuno-toge_Pass.jpg", 960, 640),
            "takekuma": ("https://upload.wikimedia.org/wikipedia/commons/b/b7/Hatsum%C5%8Dde_in_Takekoma-jinja_1.jpg", 960, 720),
            "tenryuji": ("https://upload.wikimedia.org/wikipedia/commons/e/ee/Matsuoka_station_2015.jpg", 960, 640),
            "tome": ("https://upload.wikimedia.org/wikipedia/commons/7/7b/Toyoma_school_museum050807.jpg", 960, 720),
            "tsu": ("https://upload.wikimedia.org/wikipedia/commons/5/56/140405_Tsu_Castle_Tsu_MIe_pref_Japan01s.jpg", 960, 640),
            "tsuruoka": ("https://upload.wikimedia.org/wikipedia/commons/3/3a/Moat_of_Tsurugaoka_Castle.jpg", 960, 640),
            "uji": ("https://upload.wikimedia.org/wikipedia/commons/3/3f/Uji-Bridge.jpg", 1200, 900),
            "unganji": ("https://upload.wikimedia.org/wikipedia/commons/e/ef/Tozan_Unganji_Temple_02.jpg", 960, 640),
            "yahiko": ("https://upload.wikimedia.org/wikipedia/commons/7/7e/Iyahiko-jinja_1.JPG", 960, 629),
            "yamanaka": ("https://upload.wikimedia.org/wikipedia/commons/d/d1/260606_Doumyogafuchi_Kakusenkei_Kaga_Ishikawa_pref_Japan02s3.jpg", 800, 1200),
            "yamato": ("https://upload.wikimedia.org/wikipedia/commons/a/ad/View_over_Nara_Basin%2C_Nara%2C_Japan_%282013%29.jpg", 960, 270),
            "yudono": ("https://upload.wikimedia.org/wikipedia/commons/c/c3/Yudonosan_Torii_gate_2006-A.jpg", 960, 639),
            "zenshoji": ("https://upload.wikimedia.org/wikipedia/commons/1/1a/Kyu-Daishoji_river.jpg", 960, 720),
            "zuiganji": ("https://upload.wikimedia.org/wikipedia/commons/f/fd/211030_Zuigan-ji_Matsushima_Miyagi_pref_Japan11s3.jpg", 960, 574),
          }

          outdir = Path("images/places")
          outdir.mkdir(parents=True, exist_ok=True)
          headers = {
            "User-Agent": "Mozilla/5.0 (compatible; ArukuNihonKiko/2.1; https://github.com/0dx3880342272h-prog/aruku-tokaido)",
            "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
          }

          for name, (url, width, height) in items.items():
            data = None
            last = None
            for attempt in range(4):
              try:
                req = urllib.request.Request(url, headers=headers)
                with urllib.request.urlopen(req, timeout=90) as resp:
                  data = resp.read()
                break
              except Exception as exc:
                last = exc
                time.sleep(2 ** attempt)
            if data is None:
              raise RuntimeError(f"download failed for {name}: {last}")

            with Image.open(BytesIO(data)) as src:
              im = ImageOps.exif_transpose(src).convert("RGB")
              if im.size != (width, height):
                im = im.resize((width, height), Image.Resampling.LANCZOS)
              target = outdir / f"{name}.webp"
              im.save(target, "WEBP", quality=82, method=6)
              print(name, target.stat().st_size, im.size)

          expected = set(items)
          built = {p.stem for p in outdir.glob("*.webp") if p.stem in expected}
          if built != expected:
            raise SystemExit(f"missing outputs: {sorted(expected-built)}")
          PY

      - name: Commit rebuilt images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/places/*.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Deploy 歩く日本紀行 2.1 remaining place images"
            git push origin HEAD:deploy-v21-20261006
          fi
